name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test & Build
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npm run check-types

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Bundle Production Extension
        run: npm run package

      - name: Build VSIX Package
        run: npx @vscode/vsce package -o builds/xbridge-test.vsix

      - name: Upload Test VSIX
        uses: actions/upload-artifact@v4
        with:
          name: xbridge-test-vsix
          path: builds/*.vsix
          retention-days: 7
